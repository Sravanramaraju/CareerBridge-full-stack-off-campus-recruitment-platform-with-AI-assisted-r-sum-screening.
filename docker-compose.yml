name: careerbridge

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: careerbridge
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - careerbridge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerbridge -d careerbridge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.3
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  careerbridge_postgres:
