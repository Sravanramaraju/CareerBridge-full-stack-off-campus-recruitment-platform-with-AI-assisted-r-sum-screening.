<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2658d8" />
    <meta
      name="description"
      content="CareerBridge helps early-career candidates discover verified opportunities and track every application."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CareerBridge" />
    <meta property="og:title" content="CareerBridge — Find Early-Career Jobs" />
    <meta property="og:description" content="Discover verified early-career opportunities and track every application with clarity." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareerBridge — Find Early-Career Jobs" />
    <meta name="twitter:description" content="Discover verified early-career opportunities and track every application with clarity." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CareerBridge — Find Early-Career Jobs</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('careerbridge.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : prefersDark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
